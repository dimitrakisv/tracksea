services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracksea}
      POSTGRES_USER: ${POSTGRES_USER:-tracksea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracksea_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tracksea_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  tracksea_postgres_data:
