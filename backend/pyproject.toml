[project]
name = "tracksea-backend"
version = "0.1.0"
description = "TrackSea FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115.6,<0.116",
    "google-auth[requests]>=2.37,<3",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<0.4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn[standard]>=0.34,<0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<0.29",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
